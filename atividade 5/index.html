<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #224abe;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        form {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #224abe;
        }

        fieldset {
            border: 2px solid #dcdcdc;
            border-radius: 10px;
            padding: 20px;
        }

        legend {
            padding: 0 10px;
            font-weight: bold;
            color: #224abe;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: #6c8ff8 solid 2px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .linha {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .linha .campo {
            flex: 1;
            min-width: 200px;
        }

        .opcoes {
            margin-top: 5px;
        }

        .opcoes label {
            display: inline;
            margin-right: 15px;
            font-weight: normal;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #0b236d;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #6c8ff8;
            transform: scale(1.05);
        }

        .botoes {
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width:600px) {
            .linha {
                flex-direction: column;
            }
        }

        /* funcionalidade para quand clicar em outros aparecer campo de texto */

        #outrosTexto {
            display: none;
        }

        #outros:checked~#outrosTexto {
            display: block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <form>
        
        <h1>Formulário de Cadastro</h1>

        <fieldset>
            <legend>Dados Pessoais</legend>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Maria Santos" required minlength="2">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <div class="campo">
                <label for="data">Data de Nascimento</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="campo">
                <label for="curso">Curso</label>
                <select id="curso" name="curso">
                    <option>Ciência da Computação</option>
                    <option>Sistemas de Informação</option>
                    <option>Análise e Desenvolvimento de Sistemas</option>
                    <option>Engenharia de Software</option>
                </select>
            </div>

            <div class="campo">
                <label>Sexo</label>
                <div class="opcoes">
                    <input type="radio" id="fem" name="sexo">
                    <label for="fem">Feminino</label>

                    <input type="radio" id="masc" name="sexo">
                    <label for="masc">Masculino</label>

                    <input type="radio" id="outro" name="sexo">
                    <label for="outro">Outro</label>
                </div>
            </div>

            <div class="campo">
                <label>Interesses</label>
                <div class="opcoes">
                    <input type="checkbox" id="prog">
                    <label for="prog">Programação</label>

                    <input type="checkbox" id="ia">
                    <label for="ia">IA</label>

                    <input type="checkbox" id="games">
                    <label for="games">Jogos</label>

                    <input type="checkbox" id="outros">
                    <label for="outros">Outros</label>
                    <input type="text" id="outrosTexto" placeholder="Digite seu interesse">
                </div>
            </div>

            <div class="campo">
                <label for="comentarios">Comentários</label>
                <textarea id="comentarios" placeholder="Digite"></textarea>
            </div>

            <div class="campo">
                <label for="foto">Upload de Foto</label>
                <input type="file" id="foto" name="foto">
            </div>

            <div class="botoes">
                <button type="submit">Enviar</button>
            </div>
        </fieldset>
    </form>

</body>

</html>
